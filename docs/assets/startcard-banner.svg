<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">StartCard.ai — от задачи к команде</title>
  <desc id="desc">Платформа бизнес-задач и студенческих команд. Уточните задачу, соберите отклики и выберите команду.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#11131b"/><stop offset="1" stop-color="#1e1b18"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#ff9c22"/><stop offset="1" stop-color="#ffd166"/></linearGradient>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="338" rx="23" fill="none" stroke="#3b352c"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="48" y="42" width="42" height="48" rx="11" fill="none" stroke="#f9b449" stroke-width="2" transform="rotate(-8 69 66)"/>
    <text x="69" y="74" text-anchor="middle" fill="#ffbd58" font-size="26" font-weight="700">S</text>
    <text x="108" y="76" fill="#f7f7fb" font-size="39" font-weight="750">StartCard<tspan fill="#ffb33e">.ai</tspan></text>
    <text x="48" y="143" fill="#fafafa" font-size="32" font-weight="650">От задачи к команде.</text>
    <text x="48" y="178" fill="#b5b7c2" font-size="17">Понятная постановка. Осознанный отклик. Ручной выбор.</text>
    <rect x="48" y="229" width="250" height="33" rx="16" fill="#f9b449" fill-opacity=".10" stroke="#f9b449" stroke-opacity=".35"/>
    <text x="65" y="251" fill="#f5c879" font-size="13" letter-spacing="1.3">BEARS / HACKALEM AI</text>
    <text x="48" y="301" fill="#838694" font-size="13">БИЗНЕС × СТУДЕНЧЕСКИЕ КОМАНДЫ</text>
    <path d="M804 144 L840 144 M1006 202 L1042 202" fill="none" stroke="#806541" stroke-width="2" stroke-dasharray="4 4"/>
    <g transform="translate(672 57)">
      <rect width="172" height="216" rx="17" fill="#1a1d27" stroke="#45403a"/>
      <rect x="0" y="0" width="172" height="5" rx="2" fill="url(#accent)"/>
      <text x="18" y="38" fill="#d7a052" font-size="12" letter-spacing="2">01 / ЗАДАЧА</text>
      <text x="18" y="74" fill="#f0f1f5" font-size="18" font-weight="600">Уточнить</text>
      <rect x="18" y="99" width="112" height="7" rx="3" fill="#454650"/>
      <rect x="18" y="119" width="136" height="7" rx="3" fill="#323540"/>
      <rect x="18" y="139" width="95" height="7" rx="3" fill="#323540"/>
      <text x="18" y="186" fill="#a7aab8" font-size="13">Контекст и результат</text>
    </g>
    <g transform="translate(863 79)">
      <rect width="137" height="216" rx="17" fill="#1a1d27" stroke="#45403a"/>
      <text x="16" y="37" fill="#d7a052" font-size="12" letter-spacing="1">02 / ОТКЛИК</text>
      <text x="16" y="74" fill="#f0f1f5" font-size="18" font-weight="600">Предложить</text>
      <circle cx="31" cy="113" r="14" fill="#655234"/>
      <rect x="53" y="104" width="64" height="6" rx="3" fill="#454650"/>
      <rect x="53" y="119" width="45" height="5" rx="2" fill="#323540"/>
      <text x="16" y="173" fill="#a7aab8" font-size="13">Идея, план,</text>
      <text x="16" y="191" fill="#a7aab8" font-size="13">сроки</text>
    </g>
    <g transform="translate(1020 101)">
      <rect width="132" height="216" rx="17" fill="#23201a" stroke="#8a6836"/>
      <text x="15" y="37" fill="#e9b864" font-size="12" letter-spacing="1">03 / ВЫБОР</text>
      <text x="15" y="74" fill="#f0f1f5" font-size="18" font-weight="600">Согласовать</text>
      <circle cx="38" cy="121" r="22" fill="#f9b449" fill-opacity=".15"/>
      <path d="m28 121 7 7 14-16" fill="none" stroke="#ffbd58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="15" y="179" fill="#c2b59f" font-size="13">Решение</text>
      <text x="15" y="197" fill="#c2b59f" font-size="13">за бизнесом</text>
    </g>
  </g>
